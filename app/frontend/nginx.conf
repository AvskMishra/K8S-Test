server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA: any route not matching a real file falls back to index.html
    # so client-side routing (/products/new etc.) works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend Service, using its in-cluster DNS name.
    # The browser only ever calls this app's own origin at /api/...
    location /api/ {
        proxy_pass http://product-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
