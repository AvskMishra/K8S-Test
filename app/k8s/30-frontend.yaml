apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-frontend
  namespace: product-catalog
spec:
  replicas: 3
  selector:
    matchLabels:
      app: product-frontend
  template:
    metadata:
      labels:
        app: product-frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: product-frontend
      containers:
        - name: product-frontend
          image: localhost/product-frontend:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-frontend
  namespace: product-catalog
spec:
  type: NodePort
  selector:
    app: product-frontend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
