apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: product-catalog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: product-catalog
spec:
  replicas: 1  # single instance for now — see k8s-infra-lab roadmap phase 12 for Longhorn + replica sets later
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: docker.io/library/mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: product-catalog
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
