apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: default
type: Opaque
data:
  # Values must be base64 encoded
  # echo -n "mypassword" | base64  →  bXlwYXNzd29yZA==
  DB_PASSWORD: bXlwYXNzd29yZA==          # mypassword
  DB_USER: YWRtaW4=                       # admin
  AWS_ACCESS_KEY_ID: QUNDRVNTX0tFWV9JRA== # ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: U0VDUkVUX0tFWQ== # SECRET_KEY
  JWT_SECRET: c3VwZXJfc2VjcmV0X2p3dA==   # super_secret_jwt

---
# TLS Secret for HTTPS (cert + key pair)
apiVersion: v1
kind: Secret
metadata:
  name: app-tls-secret
  namespace: default
type: kubernetes.io/tls
data:
  tls.crt: LS0tLS1CRUdJTi... # base64 encoded cert
  tls.key: LS0tLS1CRUdJTi... # base64 encoded key
