apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-pvc
  namespace: default
spec:
  storageClassName: manual-local    # Must match PV's storageClassName
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi                  # Request <= PV capacity (5Gi)
  selector:
    matchLabels:
      type: local                   # Bind to PV with this label
