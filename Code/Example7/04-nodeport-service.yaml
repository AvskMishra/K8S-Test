# =============================================================================
# SERVICE TYPE: NodePort
# =============================================================================
#
# WHAT IT IS:
#   Opens a port on EVERY node in the cluster (range 30000–32767).
#   External traffic hits any node's IP on that port → forwarded to pods.
#   Automatically creates a ClusterIP behind it (both internal + external).
#
# HOW IT WORKS:
#   External Client  →  NodeIP:30080  →  kube-proxy
#                    →  ClusterIP (internal)
#                    →  pod-1 | pod-2 | pod-3
#
#   Three ports involved:
#   ┌──────────────┬────────────────────────────────────────────────┐
#   │ nodePort     │ Port on the NODE (30000-32767). External entry. │
#   │ port         │ Port on the SERVICE (ClusterIP). Internal use.  │
#   │ targetPort   │ Port on the POD/container. Where app listens.   │
#   └──────────────┴────────────────────────────────────────────────┘
#
#   If nodePort is omitted, Kubernetes auto-assigns one in 30000-32767.
#
# WHEN TO USE:
#   - Local development / testing (minikube, kind, kubeadm on bare metal).
#   - Quick external access without a cloud load balancer.
#   - On-premise clusters where no cloud LoadBalancer provider exists.
#   - CI/CD pipelines that need to hit a service from outside the cluster.
#
# WHEN NOT TO USE:
#   - Production on cloud: use LoadBalancer instead — NodePort exposes
#     node IPs directly, no HA, no health checks at cloud LB level.
#   - You only need internal access → use ClusterIP (cheaper, simpler).
#   - nodePort range 30000-32767 may conflict with firewall rules.
#
# LIMITATIONS:
#   - One NodePort per service (can't reuse same port for two services).
#   - Client must know a node's IP — nodes can die or IP can change.
#   - No SSL termination, no host-based routing → use Ingress for that.
#
# TRAFFIC FLOW:
#   Internet → NodeIP:30080 → iptables DNAT → ClusterIP:80 → Pod:80
#
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: web-app-nodeport
  namespace: default
  labels:
    app: web-app
spec:
  type: NodePort
  selector:
    app: web-app              # Routes to pods with this label
  ports:
    - name: http
      port: 80                # ClusterIP port (internal traffic uses this)
      targetPort: 80          # Container port
      nodePort: 30080         # External port on every node (omit = auto-assign)
      protocol: TCP

# Access from outside:
#   http://<any-node-ip>:30080
#
# Access from inside cluster (same as ClusterIP):
#   http://web-app-nodeport.default.svc.cluster.local:80
#
# minikube users:
#   minikube service web-app-nodeport --url
