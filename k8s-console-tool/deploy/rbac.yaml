apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8sexplorer
  namespace: k8sexplorer
---
# Cluster-scoped because the app lets you browse ANY namespace (it lists
# namespaces itself and lets you pick one) — matches what a kubeconfig user
# with cluster-read access could already see via `kubectl get -A`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8sexplorer-read
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
# Write access for the node/pod operations menus (ClusterOperationsService):
# cordon/uncordon/taint/label = patch nodes; drain = list pods on a node +
# create evictions; pod delete/label; rollout restart = patch the workload
# (replicasets get is how a pod is traced back to its Deployment). Kept as a
# separate role so it can be left unbound for a read-only install.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8sexplorer-operate
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sexplorer-operate
subjects:
  - kind: ServiceAccount
    name: k8sexplorer
    namespace: k8sexplorer
roleRef:
  kind: ClusterRole
  name: k8sexplorer-operate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sexplorer-read
subjects:
  - kind: ServiceAccount
    name: k8sexplorer
    namespace: k8sexplorer
roleRef:
  kind: ClusterRole
  name: k8sexplorer-read
  apiGroup: rbac.authorization.k8s.io
